# ==================================================
# KITTY — MX LINUX | PASTEL ANIME CUSTOM
# ==================================================

# ---------- FUENTE ----------
font_family      FiraCode Nerd Font
font_size        12.5
bold_font        auto
italic_font      auto
bold_italic_font auto
ligatures        true

# ---------- TEMA ----------
include themes/tokyo-night.conf

# ---------- CURSOR ----------
cursor_shape beam
cursor_blink_interval 0.6
cursor_trail 2

# ---------- FONDO ----------
background_opacity 0.76
background_image ~/Imágenes/anime.jpg
background_image_layout scaled
background_image_opacity 0.12

# ---------- VENTANA ----------
window_padding_width 12
hide_window_decorations no
confirm_os_window_close 0

initial_window_width  100c
initial_window_height 30c

# ---------- SCROLL ----------
scrollback_lines 12000

# ---------- RENDIMIENTO ----------
repaint_delay 8
input_delay 2
sync_to_monitor no
enable_audio_bell no

# ---------- SHELL ----------
shell zellij
shell_integration no
